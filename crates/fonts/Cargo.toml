[package]
name = "pdfcraft-fonts"
description = "Font metrics and text encoding helpers for generated appearances (standard fonts, WinAnsi)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
# Glyph outlines of the bundled script font (typed signatures); already in the tree via egui.
skrifa = "0.44"
# Arabic shaping for text written into PDFs; already in the tree via egui, on the same read-fonts.
harfrust = "0.12"
unicode-bidi = "0.3"
# Thai line breaking (dictionary word boundaries) for multiline field appearances.
icu_segmenter = { version = "2", default-features = false, features = ["compiled_data"] }
# Grapheme clusters (splitting over-long words); already in the tree via egui.
unicode-segmentation = "1"
